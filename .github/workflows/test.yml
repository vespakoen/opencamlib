name: Test

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop
      - feat/experiments
    tags:
      - v*

jobs:
  cxx:
    name: ${{ matrix.os_short }} c++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15", "ubuntu-22.04"]
        include:
          - os: "windows-2022"
            os_short: "windows"
          - os: "macos-15"
            os_short: "macos"
          - os: "ubuntu-22.04"
            os_short: "linux"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install
        shell: bash
        run: |
          if [ "${{ matrix.os_short }}" == "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libomp-dev libboost-dev
          fi
          if [ "${{ matrix.os_short }}" == "macos" ]; then
            brew install libomp boost
          fi
          if [ "${{ matrix.os_short }}" == "windows" ]; then
            # because selectively compiling what we need is faster than running the installer
            curl -L -O https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-cmake.tar.gz
            tar -xzf boost-1.87.0-cmake.tar.gz
            cd boost-1.87.0
            cmake \
              -D CMAKE_BUILD_TYPE=Release \
              -D BOOST_INCLUDE_LIBRARIES="math;foreach;graph" \
              -S . \
              -B build
            cmake \
              --build build \
              --config Release \
              --parallel 4
            cmake \
              --install build \
              --config Release \
              --prefix "/c/Program Files (x86)/Boost"
            cd ..
          fi

          if [ "${{ matrix.os_short }}" == "windows" ]; then
            export IS_WINDOWS=1
          fi

          cmake \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_CXX_LIB="ON" \
            -S . \
            -B build
          cmake --build build --config Release --parallel 4
          cmake --install build --config Release --prefix $(pwd)/lib/ocl

          cd examples/cpp/test
          cmake \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_PREFIX_PATH="$(pwd)/../../../lib/ocl" \
            -S . \
            -B build
          cmake \
            --build build \
            --config Release \
            --parallel 4
          cd ./build
          ./test_example
