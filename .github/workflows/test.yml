  python:
    name: ${{ matrix.os_short }} python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "macos-15", "ubuntu-22.04"]
        include:
          - os: "windows-2022"
            os_short: "windows"
            python_version: "3.10"
          - os: "macos-15"
            os_short: "macos"
            python_version: "3.13"
          - os: "ubuntu-22.04"
            os_short: "linux"
            python_version: "3.10"
            cmake_generator: "Unix Makefiles"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python_version }}
      - name: Install
        shell: bash
        run: |
          python -m venv venv
          if [ "${{ matrix.os_short }}" == "windows" ]; then
            source venv/Scripts/activate
          else
            source venv/bin/activate
          fi

          if [ "${{ matrix.os_short }}" == "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libomp-dev libboost-dev libboost-python-dev
          fi
          if [ "${{ matrix.os_short }}" == "macos" ]; then
            brew install python3 libomp boost-python3
          fi
          if [ "${{ matrix.os_short }}" == "windows" ]; then
            # because selectively compiling what we need is faster than running the installer
            curl -L -O https://github.com/boostorg/boost/releases/download/boost-1.87.0/boost-1.87.0-cmake.tar.gz
            tar -xzf boost-1.87.0-cmake.tar.gz
            cd boost-1.87.0
            cmake \
              -D CMAKE_BUILD_TYPE=Release \
              -D BOOST_INCLUDE_LIBRARIES="python;math;foreach;graph" \
              -D BOOST_ENABLE_PYTHON="ON" \
              -S . \
              -B build
            cmake \
              --build build \
              --config Release \
              --parallel 4
            cmake \
              --install build \
              --config Release \
              --prefix "/c/Program Files (x86)/Boost"
            cd ..
          fi

          if [ "${{ matrix.os_short }}" == "windows" ]; then
            export IS_WINDOWS=1
          fi
          cmake \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_PY_LIB=ON \
            -S . \
            -B build
          cmake \
            --build build \
            --config Release \
            --parallel 4
          cmake \
            --install build \
            --config Release
          cd examples/python
          which python
          python test.py
